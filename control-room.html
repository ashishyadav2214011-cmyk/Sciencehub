<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScienceHub Upgrade Guard AI</title><link rel="stylesheet" href="./core/upgrade-guard-ai.css"></head><body style="margin:0"><main id="root"></main><script src="./core/upgrade-guard-ai.js"></script><script src="./core/sciencehub-upgrade-bridge.js"></script><script>const G=()=>window.UpgradeGuardAI,esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){let g=G(),s=g.state,h=g.history.slice(0,25),c=g.checkpoints;document.querySelector('#root').innerHTML=`<section class=uga-shell><div class=uga-row><div><div class=uga-small>SCIENCEHUB CORE</div><h1>Upgrade Guard AI</h1></div><span class="uga-badge uga-good">${esc(s.mode)}</span></div><p class=uga-muted>Detect → Compare → Checkpoint → Validate → Freeze / Recover</p><div class=uga-grid><article class=uga-card><h2>Version</h2><b>${esc(s.version)}</b></article><article class=uga-card><h2>Frozen phase</h2><b>${esc(s.frozenPhase?.phase??'none')}</b></article><article class=uga-card><h2>Queue</h2><b>${s.queue.length}</b></article><article class=uga-card><h2>Checkpoints</h2><b>${c.length}</b></article></div><div class=uga-card style="margin-top:12px"><button class=uga-btn onclick="audit()">Run Audit</button> <button class=uga-btn onclick="G().createCheckpoint('manual-control-room');render()">Checkpoint</button> <button class=uga-btn onclick="G().exportState()">Export Guard Backup</button><div id=checks class=uga-list></div></div><div class=uga-card style="margin-top:12px"><h2>Permissions</h2><div class=uga-list>${Object.entries(s.permissions).map(([k,v])=>`<div class=uga-item><div class=uga-row><b>${esc(k)}</b><select onchange="G().setPermission('${esc(k)}',this.value);render()"><option ${v==='ALLOW'?'selected':''}>ALLOW</option><option ${v==='ASK_FIRST'?'selected':''}>ASK_FIRST</option><option ${v==='DENY'?'selected':''}>DENY</option></select></div></div>`).join('')}</div></div><div class=uga-card style="margin-top:12px"><h2>History</h2><div class=uga-list>${h.map(x=>`<div class=uga-item><b>${esc(x.type)}</b><div class=uga-small>${esc(x.at)}</div><div class=uga-small>${esc(JSON.stringify(x.detail||{}))}</div></div>`).join('')||'No history yet.'}</div></div><div class=uga-card style="margin-top:12px"><h2>Recovery</h2><div class=uga-list>${c.map(x=>`<div class=uga-item><b>${esc(x.id)}</b><div class=uga-small>${esc(x.reason)} • ${esc(x.at)}</div><button class=uga-btn onclick="if(confirm('Rollback to this checkpoint?')){G().rollback('${esc(x.id)}');render()}">Rollback</button></div>`).join('')||'No checkpoints.'}</div></div></section>`}async function audit(){let r=await G().auditRuntime();document.querySelector('#checks').innerHTML=r.checks.map(x=>`<div class=uga-item><b class=${x.ok?'uga-good':'uga-bad'}>${x.ok?'PASS':'FAIL'}</b> ${esc(x.name)}</div>`).join('');render()}render();</script></body></html>
