<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScienceHub — Upgrade Guard AI P2</title><link rel="stylesheet" href="./core/upgrade-guard-ai.css"></head><body style="margin:0"><main id="root"></main><script src="./upgrade-guard-ai.js"></script><script src="./core/sciencehub-upgrade-bridge.js"></script><script>
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(audit){const G=window.UpgradeGuardAI,s=G.state,h=G.history.slice(0,20),c=G.checkpoints;
document.querySelector("#root").innerHTML=`<section class="uga-shell"><div class="uga-row"><div><div class="uga-small">SCIENCEHUB CORE • PHASE 2</div><h1>Upgrade Guard AI</h1></div><span class="uga-badge uga-good">${esc(s.mode)}</span></div><p class="uga-muted">Detect → Compare → Checkpoint → Validate → User decision → Freeze / Recover</p>
<div class="uga-grid"><article class="uga-card"><h3>Version</h3><b>${esc(s.version)}</b></article><article class="uga-card"><h3>Frozen phase</h3><b>${esc(s.frozenPhase?.phase??"none")}</b></article><article class="uga-card"><h3>Queue</h3><b>${s.queue.length}</b></article><article class="uga-card"><h3>Checkpoints</h3><b>${c.length}</b></article></div>
<div class="uga-card" style="margin-top:12px"><button class="uga-btn" onclick="runAudit()">Run audit</button> <button class="uga-btn" onclick="G().createCheckpoint('manual-control-room');render()">Create checkpoint</button> <button class="uga-btn" onclick="G().exportState()">Export backup</button><div id="audit" class="uga-list">${audit?audit.checks.map(x=>`<div class="uga-item"><b class="${x.ok?'uga-good':'uga-bad'}">${x.ok?'PASS':'FAIL'}</b> ${esc(x.name)}</div>`).join(""):"Audit not run in this view."}</div></div>
<div class="uga-card" style="margin-top:12px"><h3>Permissions</h3><div class="uga-list">${Object.entries(s.permissions).map(([k,v])=>`<div class="uga-item"><div class="uga-row"><b>${esc(k)}</b><select onchange="G().setPermission('${esc(k)}',this.value);render()"><option ${v==="ALLOW"?"selected":""}>ALLOW</option><option ${v==="ASK_FIRST"?"selected":""}>ASK_FIRST</option><option ${v==="DENY"?"selected":""}>DENY</option></select></div></div>`).join("")}</div></div>
<div class="uga-card" style="margin-top:12px"><h3>History</h3><div class="uga-list">${h.map(x=>`<div class="uga-item"><b>${esc(x.type)}</b><div class="uga-small">${esc(x.at)}</div><div class="uga-small">${esc(JSON.stringify(x.detail||{}))}</div></div>`).join("")||"No history yet."}</div></div>
<div class="uga-card" style="margin-top:12px"><h3>Recovery</h3><div class="uga-list">${c.map(x=>`<div class="uga-item"><b>${esc(x.id)}</b><div class="uga-small">${esc(x.reason)} • ${esc(x.at)}</div><button class="uga-btn" onclick="if(confirm('Rollback to this checkpoint?')){G().rollback('${esc(x.id)}');render()}">Rollback</button></div>`).join("")||"No checkpoints."}</div></div></section>`}
function G(){return window.UpgradeGuardAI} async function runAudit(){const r=await G().auditRuntime();render(r)} render();
</script></body></html>
