<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScienceHub P2</title><style>body{font-family:system-ui;margin:0;padding:24px;max-width:900px;margin:auto}button{padding:10px 14px;margin:4px;border:1px solid #aaa;border-radius:8px;background:#fff}section{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.ok{color:#087f23}</style></head><body><h1>ScienceHub — Phase 2</h1><p>Offline-first user-control foundation.</p><section><h2>PCB Study Flow</h2><p>Biology · Physics · Chemistry · English · Hindi</p><button onclick="save('Biology')">Save Biology Progress</button><button onclick="clearData()">Clear Local Progress</button><p id="status"></p></section><section><h2>AI Permission</h2><label><input id="ai" type="checkbox"> Allow AI actions</label><p id="aiStatus"></p></section><script>const S='sciencehub_p2';function save(s){localStorage.setItem(S,JSON.stringify({subject:s,updated:new Date().toISOString()}));status.textContent='Saved locally: '+s;status.className='ok'}function clearData(){localStorage.removeItem(S);status.textContent='Local progress cleared'}ai.onchange=()=>{localStorage.setItem('sciencehub_ai_allowed',ai.checked?'true':'false');aiStatus.textContent=ai.checked?'AI permission: ON':'AI permission: OFF'};ai.checked=localStorage.getItem('sciencehub_ai_allowed')==='true';ai.onchange()</script></body></html>
