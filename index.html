<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <meta name="description" content="ScienceHub — personal, local-first study operating system">
  <title>ScienceHub — Personal Study OS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./sciencehub-icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./perspective.css">
  <link rel="stylesheet" href="./sciencehub-v101.css">
  <link rel="stylesheet" href="./sciencehub-v102-repair.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="homeBtn" type="button" aria-label="Go to ScienceHub home">
      <canvas id="brandCanvas" width="64" height="64" aria-hidden="true"></canvas>
      <span><strong>ScienceHub</strong><small style="display:block;color:var(--muted);font-size:10px">Personal Study OS</small></span>
    </button>
    <span class="user">Class 11 • PCB</span>
    <button class="icon" id="settingsBtn" type="button" aria-label="Settings">⚙️</button>
    <button class="icon" id="moreBtn" type="button" aria-label="Open navigation">☰</button>
  </header>

  <main id="app" aria-live="polite"></main>
  <div id="perspectiveMount"></div>
  <nav class="bottom" aria-label="Primary navigation">
    <button type="button" data-go="home"><span>🏠</span><small>Home</small></button>
    <button type="button" data-go="study"><span>📅</span><small>Study</small></button>
    <button type="button" data-go="subjects"><span>📚</span><small>Subjects</small></button>
    <button type="button" data-go="learning"><span>🧠</span><small>Review</small></button>
    <button type="button" id="moreBtnBottom" onclick="document.getElementById('moreBtn').click()"><span>☰</span><small>More</small></button>
  </nav>
  <div id="drawer" aria-label="Navigation drawer"></div>
  <div id="modal" aria-label="Dialog"></div>

  <!-- Order matters: the core runtime must exist before its additive bridges. -->
  <script src="./app.js"></script>
  <script src="./sciencehub-enhancements.js"></script>
  <script src="./sciencehub-v101-bridge.js"></script>
  <script src="./sciencehub-perspective.js"></script>
  <script src="./sciencehub-v102-repair.js"></script>
</body>
</html>
