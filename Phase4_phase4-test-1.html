<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScienceHub Upgrade Guard AI — Phase 4 Test</title></head>
<body>
<h1>Phase 4 Test</h1>
<p id="status">Loading…</p>
<pre id="out"></pre>
<script src="../upgrade-guard-ai.js"></script>
<script src="../core/sciencehub-upgrade-bridge.js"></script>
<script src="../core/phase3-regression.js"></script>
<script src="../core/upgrade-guard-ai-phase3.js"></script>
<script src="../core/phase4-data-guardian.js"></script>
<script src="../core/phase4-pwa-guardian.js"></script>
<script src="../core/phase4-bridge.js"></script>
<script>
(async()=>{
  const out=document.getElementById("out");
  try{
    const r=await window.UpgradeGuardPhase4.validate();
    document.getElementById("status").textContent=r.ok?"PASS":"BLOCKED";
    out.textContent=JSON.stringify(r,null,2);
  }catch(e){
    document.getElementById("status").textContent="ERROR";
    out.textContent=String(e);
  }
})();
</script>
</body></html>
