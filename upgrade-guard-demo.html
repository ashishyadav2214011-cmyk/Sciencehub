<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScienceHub P3 Upgrade Guard</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:24px}button{padding:10px;margin:4px;border-radius:8px;border:1px solid #aaa;background:white}pre{background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap}.warn{color:#a05a00}.ok{color:#087f23}</style></head><body><h1>ScienceHub — Phase 3: Upgrade Guard AI</h1><p>User permission is required before an AI upgrade can act.</p><label><input id="perm" type="checkbox"> Allow Upgrade Guard to act</label><br><button onclick="attempt()">Test Upgrade</button><button onclick="fail()">Create Failed Upgrade Record</button><button onclick="refresh()">Refresh State</button><pre id="out"></pre><script src="upgrade-guard.js"></script><script>const out=document.getElementById('out'),perm=document.getElementById('perm');function refresh(){const s=ScienceHubUpgradeGuard.getState();perm.checked=s.permission;out.textContent=JSON.stringify(s,null,2)}perm.onchange=()=>{ScienceHubUpgradeGuard.setPermission(perm.checked);refresh()};function attempt(){const r=ScienceHubUpgradeGuard.runUpgrade('Demo upgrade',()=>({message:'Upgrade executed under user permission'}));out.textContent=JSON.stringify(r,null,2)}function fail(){const r=ScienceHubUpgradeGuard.recordFailedUpgrade('Demo failed upgrade','Test failure record');out.textContent=JSON.stringify(r,null,2)}refresh()</script></body></html>
